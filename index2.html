```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Date Proposal</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary: #ff4d6d;
      --primary-hover: #ff758f;
      --accent: #c9184a;
      --text: #590d22;
      --gray: #a8a29e;
      --shadow-color: rgba(201, 24, 74, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 35px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px var(--shadow-color);
      max-width: 480px;
      width: 100%;
      text-align: center;
      position: relative;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .heart-bg {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.5rem;
      animation: heartPulse 1.8s ease-in-out infinite;
    }

    @keyframes heartPulse {
      0%, 100% { transform: translate(-50%, 0) scale(1); }
      50% { transform: translate(-50%, -12px) scale(1.15); }
    }

    h1 {
      font-size: 1.8rem;
      margin-top: 10px;
      margin-bottom: 8px;
      color: var(--accent);
    }

    p {
      margin-bottom: 22px;
      color: #725159;
      font-size: 0.95rem;
    }

    /* Side-by-Side Floating Wrapper for Buttons */
    .btn-group-wrapper {
      position: relative;
      width: 100%;
      height: 60px;
      margin-top: 20px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    button, .submit-btn {
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .btn-yes, .submit-btn {
      background: linear-gradient(45deg, var(--accent), var(--primary));
      color: white;
      box-shadow: 0 6px 18px var(--shadow-color);
    }

    .btn-yes:hover, .submit-btn:hover {
      background: linear-gradient(45deg, var(--primary), var(--primary-hover));
      transform: translateY(-2px) scale(1.04);
    }

    .btn-no {
      background-color: var(--gray);
      color: white;
      position: absolute;
      left: 55%;
      top: 0;
      transition: all 0.15s ease-out;
    }

    .section {
      display: none;
      margin-top: 25px;
      border-top: 2px dashed #ffccd5;
      padding-top: 22px;
      animation: slideUpFade 0.6s ease-out forwards;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Form Fields for Girls Choice */
    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ffccd5;
      border-radius: 12px;
      background: #fff0f3;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 8px rgba(255, 77, 109, 0.3);
    }

    .submit-btn {
      width: 100%;
      margin-top: 10px;
    }

    /* Confirmation Card */
    .summary-card {
      background: #fff0f3;
      padding: 15px;
      border-radius: 14px;
      text-align: left;
      margin-top: 15px;
    }

    .summary-card p {
      margin-bottom: 8px;
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="heart-bg">💖</div>
    
    <h1 id="main-title">Will you go on a date with me?</h1>
    <p id="sub-title">I promise it will be an unforgettable time!</p>

    <div class="btn-group-wrapper" id="btn-wrapper">
      <div class="btn-group">
        <button class="btn-yes" id="yes-btn">YES!</button>
        <button class="btn-no" id="no-btn">No</button>
      </div>
    </div>

    <div class="section" id="planner-section">
      <h2 style="color: var(--accent); margin-bottom: 15px;">Plan Our Perfect Date 💕</h2>
      <form id="date-form">
        <div class="form-group">
          <label for="date-select">📅 Choose the Date</label>
          <input type="date" id="date-select" required>
        </div>

        <div class="form-group">
          <label for="time-select">⏰ Pick a Time</label>
          <input type="time" id="time-select" required>
        </div>

        <div class="form-group">
          <label for="place-input">📍 Where Should We Go?</label>
          <input type="text" id="place-input" placeholder="e.g. Cozy Cafe, Beachside, Rooftop..." required>
        </div>

        <div class="form-group">
          <label for="food-input">🍕 What Are You Craving?</label>
          <input type="text" id="food-input" placeholder="e.g. Italian, Sushi, Ice Cream..." required>
        </div>

        <button type="submit" class="submit-btn">Lock It In! ✨</button>
      </form>
    </div>

    <div class="section" id="summary-section">
      <h2 style="color: var(--accent); margin-bottom: 15px;">It's Official! 🎉</h2>
      <div class="summary-card">
        <p><strong>📅 Date:</strong> <span id="sum-date"></span></p>
        <p><strong>⏰ Time:</strong> <span id="sum-time"></span></p>
        <p><strong>📍 Place:</strong> <span id="sum-place"></span></p>
        <p><strong>🍕 Food:</strong> <span id="sum-food"></span></p>
      </div>
    </div>

  </div>

  <script>
    const noBtn = document.getElementById('no-btn');
    const yesBtn = document.getElementById('yes-btn');
    const btnWrapper = document.getElementById('btn-wrapper');
    const plannerSection = document.getElementById('planner-section');
    const summarySection = document.getElementById('summary-section');
    const dateForm = document.getElementById('date-form');

    // Runaway "No" Button Logic
    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', moveNoButton);

    function moveNoButton() {
      const containerRect = btnWrapper.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = containerRect.width - btnRect.width;
      const maxY = 150; // Allow it to run down slightly outside the wrapper

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY) - 20;

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    // YES Button Click Handler
    yesBtn.addEventListener('click', () => {
      document.getElementById('main-title').innerText = "Yay! You said YES! 🥰";
      document.getElementById('sub-title').innerText = "Now tell me what your dream date looks like:";
      btnWrapper.style.display = 'none';

      plannerSection.style.display = 'block';
    });

    // Handle Form Submission
    dateForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const dateVal = document.getElementById('date-select').value;
      const timeVal = document.getElementById('time-select').value;
      const placeVal = document.getElementById('place-input').value;
      const foodVal = document.getElementById('food-input').value;

      document.getElementById('sum-date').innerText = dateVal;
      document.getElementById('sum-time').innerText = timeVal;
      document.getElementById('sum-place').innerText = placeVal;
      document.getElementById('sum-food').innerText = foodVal;

      plannerSection.style.display = 'none';
      summarySection.style.display = 'block';
      document.getElementById('sub-title').innerText = "I've saved all your choices! See you then ❤️";
    });
  </script>
</body>
</html>

```
